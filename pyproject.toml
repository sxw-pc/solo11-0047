[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowquery-autopsy"
version = "1.0.0"
description = "Offline slow-query log and execution-plan autopsy toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - authorized local analysis only"}
authors = [{name = "Slow Query Autopsy maintainers"}]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
slowquery-autopsy = "slowquery_autopsy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slowquery_autopsy = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
